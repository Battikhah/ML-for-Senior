[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treevibes-experiments"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.12,<2", "librosa==0.11.0", "scikit-learn>=1.5,<2", "pandas>=2,<3", "openpyxl==3.1.5", "mlflow>=3.0,<4", "kagglehub>=0.3,<1", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
train = ["tensorflow==2.16.2", "tf-keras==2.16.0", "tensorflow-model-optimization==0.8.0", "torch==2.5.1"]
keras = ["tensorflow==2.16.2", "tf-keras==2.16.0", "tensorflow-model-optimization==0.8.0"]
reference = ["torch==2.5.1"]
dev = ["pytest>=8,<9", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
include = ["treevibes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*aifc.*:DeprecationWarning", "ignore:.*audioop.*:DeprecationWarning", "ignore:.*sunau.*:DeprecationWarning"]
